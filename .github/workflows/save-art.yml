# New strain art from Drive (sent by the Redbird Website script) → resized, saved to img/, added to the site.
name: Save strain art
on:
  push:
    branches: [main]
    paths: ['incoming/**']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: save-art
  cancel-in-progress: false
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==10.4.0
      - id: art
        run: python .github/scripts/save_art.py
      - name: Commit
        run: |
          git config user.name "Redbird art bot"
          git config user.email "redbird-art-bot@users.noreply.github.com"
          git add -A img assets incoming '*.html'
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Save strain art: ${{ steps.art.outputs.saved || 'cleanup' }}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request skipped"
