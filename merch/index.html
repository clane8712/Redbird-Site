<!-- 21+ age gate: birthday check before anyone sees the site. Remembered on this device for 30 days. -->
<style>
#rb-age { position: fixed; inset: 0; z-index: 9999; background: rgba(17,17,17,0.94); display: flex; align-items: center; justify-content: center; padding: 16px; font-family: 'DM Sans', sans-serif; }
#rb-age[hidden] { display: none; }
#rb-age .card { width: 100%; max-width: 440px; background: #FFFFFF; color: #111111; border-radius: 16px; border-top: 6px solid #C8102E; padding: 32px 28px 26px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 24px 64px rgba(0,0,0,0.4); }
#rb-age .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 22px; }
#rb-age .brand img { height: 30px; width: auto; display: block; }
#rb-age h2 { margin: 0; font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: 46px; letter-spacing: 1.5px; line-height: 0.95; }
#rb-age p { margin: 0; font-size: 15px; line-height: 1.55; color: #555555; }
#rb-age .eyebrow { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #C8102E; }
#rb-age .fields { display: grid; grid-template-columns: 1fr 1fr 1.5fr; gap: 10px; }
#rb-age label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; color: #555555; }
#rb-age input { height: 52px; border: 1px solid rgba(0,0,0,0.15); border-radius: 8px; background: #F7F7F9; font: inherit; font-size: 20px; font-weight: 600; text-align: center; color: #111111; width: 100%; box-sizing: border-box; }
#rb-age input:focus { outline: 2px solid #C8102E; outline-offset: 1px; background: #FFFFFF; }
#rb-age button { height: 52px; border: 0; border-radius: 8px; background: #C8102E; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
#rb-age button:hover { background: #9E0B22; }
#rb-age .err { min-height: 20px; font-size: 14px; font-weight: 600; color: #C8102E; }
#rb-age .fine { font-size: 12px; line-height: 1.5; color: #767676; }
#rb-age .denied { display: none; }
#rb-age.no .ask { display: none; }
#rb-age.no .denied { display: flex; flex-direction: column; gap: 12px; }
</style>
<div id="rb-age" role="dialog" aria-modal="true" aria-labelledby="rb-age-title" hidden>
  <div class="card">
    <div class="brand"><img src="../img/wordmark-red.svg" alt="Redbird"></div>
    <form class="ask" novalidate style="display: flex; flex-direction: column; gap: 16px">
      <div class="eyebrow">21+ only</div>
      <h2 id="rb-age-title">How old are you?</h2>
      <p>You must be 21 or older to visit this site. Enter your birthday to continue.</p>
      <div class="fields">
        <label>Month<input id="rb-m" inputmode="numeric" autocomplete="bday-month" maxlength="2" placeholder="MM" aria-label="Birth month"></label>
        <label>Day<input id="rb-d" inputmode="numeric" autocomplete="bday-day" maxlength="2" placeholder="DD" aria-label="Birth day"></label>
        <label>Year<input id="rb-y" inputmode="numeric" autocomplete="bday-year" maxlength="4" placeholder="YYYY" aria-label="Birth year"></label>
      </div>
      <div class="err" role="alert" aria-live="assertive"></div>
      <button type="submit">Enter site</button>
      <div class="fine">Redbird products are for adults 21 and older. For use only where legal in Washington State.</div>
    </form>
    <div class="denied">
      <h2>Sorry, you must be 21 or older.</h2>
      <p>Come back when you're 21. Thanks for stopping by.</p>
    </div>
  </div>
</div>
<script>
(function () {
  var KEY = 'rb_age_ok_until', DAYS = 30;
  var gate = document.getElementById('rb-age');
  var ok = false;
  try { ok = Number(localStorage.getItem(KEY) || 0) > Date.now(); } catch (e) {}
  if (/[?&]agecheck\b/.test(location.search)) ok = false;   // ?agecheck shows it again (for testing)
  if (ok) return;
  gate.hidden = false;
  var m = document.getElementById('rb-m'), d = document.getElementById('rb-d'), y = document.getElementById('rb-y');
  var err = gate.querySelector('.err');
  [m, d, y].forEach(function (el, i, all) {
    el.addEventListener('input', function () {
      el.value = el.value.replace(/\D/g, '');
      if (el.value.length >= el.maxLength && all[i + 1]) all[i + 1].focus();
    });
  });
  setTimeout(function () { m.focus(); }, 50);
  gate.querySelector('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var mm = +m.value, dd = +d.value, yy = +y.value, now = new Date();
    var born = new Date(yy, mm - 1, dd);
    if (!mm || !dd || y.value.length !== 4 || born.getMonth() !== mm - 1 || born.getDate() !== dd || born > now || yy < 1900) {
      err.textContent = 'Please enter a real birthday (MM / DD / YYYY).'; return;
    }
    var age = now.getFullYear() - yy - ((now.getMonth() < mm - 1 || (now.getMonth() === mm - 1 && now.getDate() < dd)) ? 1 : 0);
    if (age < 21) { gate.classList.add('no'); return; }
    try { localStorage.setItem(KEY, String(Date.now() + DAYS * 864e5)); } catch (e) {}
    gate.hidden = true;
  });
})();
</script>
